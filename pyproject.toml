[project]
name = "autonomous-pms"
version = "4.0.0"
description = "Autonomous multi-factor portfolio management system (US NYSE/NASDAQ + India NSE/BSE) with Point-in-Time lakehouse, self-calibrating estimators and HRP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "PyYAML>=6.0",
    "exchange-calendars>=4.5",
]

[project.optional-dependencies]
# Heavy / optional: local quantized ONNX semantic backend (bge-small-en-v1.5).
onnx = [
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
    "huggingface-hub>=0.24",
]
# Stage-3 only: Mistral Timestral zero-shot forecaster (the 7th pillar). This extra
# is installed **only in the fan-in job** — the 209M checkpoint is 837 MB, so it must
# never ride along with the ten parallel Stage-2A company shards (see
# .github/workflows/parallel_dag_pipeline.yml). Without it the engine degrades to its
# deterministic empirical fallback and reports ``mode = offline_fallback``.
timestral = [
    "torch>=2.4",
    "safetensors>=0.4.5",
    "timestral",
]
dev = [
    "pytest>=8.2",
]

[tool.uv]
# The fan-in runs on the free GitHub Ubuntu runners (no GPU). The default PyPI torch
# wheel bundles the CUDA runtime; pin the CPU-only wheel index instead.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# Standalone inference package for the Timestral checkpoints (Apache-2.0). Pinned to
# the default branch; uv.lock records the resolved commit for reproducibility.
timestral = { git = "https://github.com/mistralai/timestral.git", branch = "main" }

[project.scripts]
pms = "src.main_v4:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
