[project]
name = "autonomous-pms"
version = "4.0.0"
description = "Autonomous multi-factor portfolio management system (US NYSE/NASDAQ + India NSE/BSE) with Point-in-Time lakehouse, self-calibrating estimators and HRP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "PyYAML>=6.0",
    "exchange-calendars>=4.5",
]

[project.optional-dependencies]
# Heavy / optional: local quantized ONNX semantic backend (bge-small-en-v1.5).
onnx = [
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
    "huggingface-hub>=0.24",
]
dev = [
    "pytest>=8.2",
]

[project.scripts]
pms = "src.main_v4:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
