# =============================================================================
# PMS V5 — weekly deep sync and walk-forward research.
#
#   • full SEC EDGAR companyfacts (all XBRL periods) + 10-K Item 1 business text
#   • India NSE/BSE Ind-AS results + Regulation 31 promoter pledge / FII-DII
#   • OpenAlex + USPTO PatentsView technology velocity
#   • walk-forward validation on the refreshened Point-in-Time lakehouse
#   • dashboard + Pages redeploy
#
# Runs Sunday 16:23 UTC (21:53 IST), leaving a buffer before Monday's India EOD run.
# Targets validate/refresh the slow-moving pillars that the daily fast path skips. A
# follow-up job runs V5 walk-forward research after the lakehouse is verified/published.
# =============================================================================
name: PMS V5 — Weekly Deep Ingestion & Walk-Forward

on:
  schedule:
    # Avoid the top of the hour, when GitHub documents elevated schedule delays.
    - cron: "23 16 * * 0"         # Sunday 16:23 UTC (21:53 IST)
  workflow_dispatch:

concurrency:
  group: pms-v4-global-state-lock
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

env:
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  deep-company-shards:
    strategy:
      fail-fast: false
      matrix:
        market: [US, INDIA]
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --extra onnx

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pms_sec
            ~/.cache/pms_nse
            ~/.cache/pms_http
            ~/.cache/onnx_models
          key: pms-deep-${{ matrix.market }}-${{ github.run_id }}
          restore-keys: pms-deep-${{ matrix.market }}-

      - name: Restore prior lakehouse for historical PIT valuation
        uses: actions/cache/restore@v6
        with:
          path: data_lake
          key: pms-lake-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: pms-lake-${{ github.ref_name }}-

      - name: Deep fundamentals + long OHLCV history shard
        env:
          SEC_USER_AGENT: "AutonomousPMS/4.0 (contact: rishichowdhury080@gmail.com)"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run python -m src.ingestion.company_shard_worker \
            --market ${{ matrix.market }} \
            --shard-id ${{ matrix.shard }} \
            --total-shards 5 \
            --output-dir shards \
            --lake-dir data_lake \
            --lookback-days 1500 \
            --backend onnx

      - uses: actions/upload-artifact@v7
        with:
          name: deep-${{ matrix.market }}-${{ matrix.shard }}
          path: shards/
          retention-days: 5
          if-no-files-found: warn

  deep-tech-shards:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --extra onnx

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pms_openalex
            ~/.cache/pms_http
          key: pms-deep-tech-${{ github.run_id }}
          restore-keys: pms-deep-tech-

      - name: Patents / publications / R&D velocity (shard ${{ matrix.shard }}/5)
        env:
          PATENTSVIEW_API_KEY: ${{ secrets.PATENTSVIEW_API_KEY }}
        run: |
          # Universe sharding happens BEFORE the crawl, so this job fetches only
          # its ~1/5 slice; each shard writes its own file (tech_patents_velocity_<id>)
          # and a crawl budget bounds the whole step.
          uv run python -m src.ingestion.tech_patents_openalex \
            --output-dir shards --limit 500 \
            --shard-id ${{ matrix.shard }} --total-shards 5 \
            --max-minutes 20 || true

      - uses: actions/upload-artifact@v7
        with:
          name: deep-tech-${{ matrix.shard }}
          path: shards/
          retention-days: 5
          if-no-files-found: warn

  validate-and-publish:
    needs: [deep-company-shards, deep-tech-shards]
    if: needs.deep-company-shards.result == 'success' && needs.deep-tech-shards.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          path: repo

      - uses: actions/checkout@v7
        with:
          ref: data-state
          path: state_branch
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: data_lake
          key: pms-lake-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: pms-lake-${{ github.ref_name }}-

      # The weekly fan-in publishes the same 7th pillar as the daily path, so it mounts
      # the same Stage-3 checkpoint cache (stable key -> warmed once, no re-upload).
      - name: Cache ONNX BGE + Mistral Timestral-5M (weekly fan-in)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/onnx_models
            ~/.cache/huggingface
          key: pms-stage3-models-bge-timestral-5m-v1
          restore-keys: pms-stage3-models-

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: repo/uv.lock

      - name: Install dependencies
        working-directory: repo
        run: uv sync --all-extras

      - uses: actions/download-artifact@v8
        with:
          pattern: deep-*
          path: staged_shards
          merge-multiple: true

      - name: Fan-In (weekly deep sync)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        working-directory: repo
        run: |
          uv run python -m src.main_v5 \
            --mode weekly_deep_sync \
            --target-market BOTH \
            --data-dir ../data_lake \
            --shards-dir ../staged_shards \
            --state-dir ../state_branch \
            --output-issue ../issue_body.md \
            --dashboard-html ../pages_dist/index.html \
            --backend onnx

      - name: Verify Parquet integrity before research replay
        working-directory: repo
        run: uv run python -m src.storage.verify_parquet --data-dir ../data_lake

      - name: Rebuild dashboard with the fresh NAV curves
        working-directory: repo
        run: |
          uv run python -m src.reporting.dashboard_builder \
            --state-dir ../state_branch \
            --output-html ../pages_dist/index.html

      - name: Commit state
        run: |
          set -euo pipefail
          cd state_branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore(state): weekly deep sync $(date -u +%Y-%m-%d)"
          git push origin HEAD:data-state

      - name: Publish the weekly report as an Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="🧪 V5 Weekly Deep Sync — $(date -u +%Y-%m-%d)"
          {
            echo "## Trade ticket (weekly deep sync)"
            echo
            cat issue_body.md
            echo
          } > weekly_report.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
            --label automation --body-file weekly_report.md || true

      - name: Ship the lakehouse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd data_lake
          tar -czf ../lake.tar.gz .
          cd ..
          gh release view v-data-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create v-data-latest --repo "$GITHUB_REPOSITORY" --title "Rolling lakehouse" \
                 --notes "Rotating Point-in-Time Parquet lakehouse (data_lake/*.parquet)"
          gh release upload v-data-latest lake.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-live
          path: pages_dist

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-live

  walk-forward:
    needs: validate-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: repo

      - uses: actions/checkout@v7
        with:
          ref: data-state
          path: state_branch
          fetch-depth: 0

      - name: Download the lakehouse published by the weekly sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download v-data-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern lake.tar.gz \
            --dir /tmp
          mkdir -p data_lake
          tar -xzf /tmp/lake.tar.gz -C data_lake

      - name: Restore cached Timestral and embedding model files
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/onnx_models
            ~/.cache/huggingface
          key: pms-stage3-models-bge-timestral-5m-v1
          restore-keys: pms-stage3-models-

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: repo/uv.lock

      - name: Install V5 research dependencies
        working-directory: repo
        run: uv sync --all-extras

      - name: Verify published Parquet before backtesting
        working-directory: repo
        run: uv run python -m src.storage.verify_parquet --data-dir ../data_lake

      - name: V5 point-in-time walk-forward (US + India)
        timeout-minutes: 240
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        working-directory: repo
        run: |
          set -euo pipefail
          uv run python -m src.backtest.walk_forward_v4 \
            --lake-dir ../data_lake \
            --state-dir ../state_branch \
            --market BOTH \
            --rebalance-step-days 5 \
            --warmup 60 | tee ../backtest_summary.json

      - name: Archive walk-forward report and curves
        uses: actions/upload-artifact@v7
        with:
          name: walk-forward-${{ github.run_id }}
          path: |
            backtest_summary.json
            state_branch/walk_forward_summary.json
            state_branch/walk_forward_nav_history.jsonl
          retention-days: 90
          if-no-files-found: error

      - name: Rebuild dashboard with the new backtest curves
        working-directory: repo
        run: |
          uv run python -m src.reporting.dashboard_builder \
            --state-dir ../state_branch \
            --output-html ../pages_dist/index.html

      - name: Commit backtest state
        run: |
          set -euo pipefail
          cd state_branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add walk_forward_summary.json walk_forward_summary_us.json \
            walk_forward_summary_india.json walk_forward_nav_history.jsonl
          git diff --staged --quiet || git commit -m "chore(backtest): weekly V5 walk-forward $(date -u +%Y-%m-%d)"
          git push origin HEAD:data-state

      - name: Publish walk-forward results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="🧪 V5 Walk-Forward Results — $(date -u +%Y-%m-%d)"
          {
            echo "## Point-in-time backtest results (net of modeled transaction costs)"
            echo
            echo '```json'
            cat backtest_summary.json
            echo '```'
            echo
            echo "Execution note: full historical Golden Copy quorum evidence is unavailable, so the live pre-trade verification gate is not represented in this research replay."
          } > walk_forward_report.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
            --label automation --body-file walk_forward_report.md || true

      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-walk-forward
          path: pages_dist

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-walk-forward
